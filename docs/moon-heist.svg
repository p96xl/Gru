<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a2350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#fff6d5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff6d5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="360" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="60" cy="40" r="1.4"/><circle cx="140" cy="90" r="1"/><circle cx="220" cy="30" r="1.6"/>
    <circle cx="310" cy="70" r="1"/><circle cx="380" cy="25" r="1.3"/><circle cx="450" cy="95" r="1"/>
    <circle cx="520" cy="45" r="1.5"/><circle cx="590" cy="120" r="1"/><circle cx="830" cy="200" r="1.2"/>
    <circle cx="860" cy="40" r="1.4"/><circle cx="40" cy="160" r="1"/><circle cx="260" cy="150" r="1.2"/>
  </g>

  <!-- the moon -->
  <circle cx="720" cy="105" r="95" fill="url(#glow)"/>
  <circle cx="720" cy="105" r="62" fill="#f4ecc9"/>
  <g fill="#ddd2a6">
    <circle cx="700" cy="88" r="11"/><circle cx="742" cy="122" r="8"/><circle cx="735" cy="78" r="5"/>
    <circle cx="698" cy="128" r="6"/>
  </g>

  <!-- the beam: from the GPUs up to the moon -->
  <polygon points="300,250 310,236 690,128 700,150" fill="#7ee0ff" opacity="0.18"/>
  <line x1="305" y1="243" x2="695" y2="138" stroke="#7ee0ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- rooftop -->
  <rect x="0" y="300" width="900" height="60" fill="#120f22"/>
  <rect x="0" y="296" width="900" height="6" fill="#1f1a38"/>

  <!-- two GPU cards on a stand, aimed at the moon -->
  <g transform="translate(250 262) rotate(-15)">
    <rect x="0" y="0" width="110" height="22" rx="3" fill="#c0392b"/>
    <circle cx="28" cy="11" r="7" fill="#7a1d14"/><circle cx="62" cy="11" r="7" fill="#7a1d14"/>
    <rect x="90" y="4" width="16" height="14" fill="#e8e8e8"/>
    <rect x="0" y="-26" width="110" height="22" rx="3" fill="#4b5563"/>
    <rect x="8" y="-20" width="80" height="10" fill="#9ca3af"/>
    <rect x="90" y="-22" width="16" height="14" fill="#e8e8e8"/>
  </g>
  <rect x="278" y="276" width="10" height="22" fill="#3b3560"/>
  <rect x="262" y="292" width="42" height="6" fill="#3b3560"/>

  <!-- the villain: tall, long coat, one arm raised at the moon -->
  <g fill="#05060f">
    <ellipse cx="160" cy="132" rx="19" ry="22"/>
    <rect x="152" y="150" width="16" height="12"/>
    <path d="M128 165 Q160 152 192 165 L206 296 L114 296 Z"/>
    <path d="M186 170 L262 112 L268 120 L196 186 Z"/>
    <circle cx="265" cy="115" r="7"/>
    <path d="M132 172 L106 236 L116 240 L144 188 Z"/>
  </g>
  <!-- goggles glint -->
  <circle cx="168" cy="128" r="5" fill="none" stroke="#7ee0ff" stroke-width="2"/>

  <!-- the helpers: small boxy bots with one antenna -->
  <g>
    <g transform="translate(360 262)">
      <rect x="0" y="0" width="26" height="30" rx="5" fill="#94a3b8"/>
      <rect x="5" y="7" width="16" height="8" rx="2" fill="#0b1026"/>
      <circle cx="10" cy="11" r="2" fill="#7ee0ff"/><circle cx="16" cy="11" r="2" fill="#7ee0ff"/>
      <line x1="13" y1="0" x2="13" y2="-8" stroke="#94a3b8" stroke-width="2"/><circle cx="13" cy="-9" r="2.5" fill="#f97316"/>
      <rect x="4" y="30" width="6" height="6" fill="#64748b"/><rect x="16" y="30" width="6" height="6" fill="#64748b"/>
    </g>
    <g transform="translate(400 268) scale(0.8)">
      <rect x="0" y="0" width="26" height="30" rx="5" fill="#a3a3a3"/>
      <rect x="5" y="7" width="16" height="8" rx="2" fill="#0b1026"/>
      <circle cx="13" cy="11" r="2.5" fill="#7ee0ff"/>
      <line x1="13" y1="0" x2="13" y2="-8" stroke="#a3a3a3" stroke-width="2"/><circle cx="13" cy="-9" r="2.5" fill="#22c55e"/>
      <rect x="4" y="30" width="6" height="6" fill="#64748b"/><rect x="16" y="30" width="6" height="6" fill="#64748b"/>
    </g>
    <g transform="translate(60 266) scale(0.9)">
      <rect x="0" y="0" width="26" height="30" rx="5" fill="#94a3b8"/>
      <rect x="5" y="7" width="16" height="8" rx="2" fill="#0b1026"/>
      <circle cx="10" cy="11" r="2" fill="#7ee0ff"/><circle cx="16" cy="11" r="2" fill="#7ee0ff"/>
      <line x1="13" y1="0" x2="13" y2="-8" stroke="#94a3b8" stroke-width="2"/><circle cx="13" cy="-9" r="2.5" fill="#eab308"/>
      <rect x="4" y="30" width="6" height="6" fill="#64748b"/><rect x="16" y="30" width="6" height="6" fill="#64748b"/>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M190 30 H520 a14 14 0 0 1 14 14 V92 a14 14 0 0 1 -14 14 H250 L205 122 L218 106 H190 a14 14 0 0 1 -14 -14 V44 a14 14 0 0 1 14 -14 Z" fill="#fff"/>
    <text x="355" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b1026">Tonight, we take the MOON.</text>
    <text x="355" y="88" text-anchor="middle" font-size="14" fill="#4b5563">With two GPUs and one SSD.</text>
  </g>

  <text x="880" y="340" text-anchor="end" font-size="13" fill="#8b85b8">Gru: one drive, every card, a minion to do the work</text>
</svg>
